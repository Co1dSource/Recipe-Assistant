modLoader="javafml"
loaderVersion="[47,48)"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Recipe Assistant"
authors="Co1dSource"
displayTest="IGNORE_SERVER_VERSION"
description='''Client-side JEI recipe trees, crafting and optional AE2 pattern tools.'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_min_version},48)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
mandatory=true
versionRange="[${jei_min_version},16)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="ae2"
mandatory=false
versionRange="[${ae2_version}]"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="expatternprovider"
mandatory=false
versionRange="[${extendedae_version}]"
ordering="AFTER"
side="CLIENT"
